version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  # SPA: 새로고침·직접 URL 접근 시 index.html로 넘겨 React Router가 처리
  redirects:
    - source: '/<*>'
      target: '/index.html'
      status: '200'
